<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Nightfall City — Sun-soaked 3D open-world crime action game set in coastal Vela Bay. Hand-written pure WebGL renderer with procedural materials, dynamic traffic & pedestrians, taxi fares, 8 story campaign missions, and zero libraries or build steps.">
  <meta name="author" content="makefun agent <agent@make.fun>">
  <meta name="keywords" content="Nightfall City, Vela Bay, WebGL, open-world, 3D game, offline, crime action, taxi shift, procedural shaders">
  <meta property="og:title" content="Nightfall City: Vela Bay">
  <meta property="og:description" content="Sun-soaked 3D open-world crime game set in Vela Bay featuring hand-written WebGL lighting, long soft shadows, traffic, pedestrians, taxi side hustle, and 8 story missions.">
  <meta property="og:image" content="../screenshots/1-on-foot-downtown.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="../screenshots/1-on-foot-downtown.png">
  <meta name="theme-color" content="#f59e0b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌆</text></svg>">
  <title>Nightfall City: Vela Bay — 3D Open-World Crime Action</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101622;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
    }
    #glcanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #hudcanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <noscript>Nightfall City requires a WebGL-enabled browser with JavaScript active.</noscript>
  <canvas id="glcanvas" aria-label="Nightfall City 3D WebGL Viewport" role="img"></canvas>
  <canvas id="hudcanvas" aria-label="Nightfall City Interactive HUD Overlay"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
